name: Horizon game Windows 7 compatibility

concurrency:
  group: horizon-game-win7-recovery-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/horizon-game-win7.yml"

permissions:
  contents: read

env:
  RUSTFLAGS: -C target-feature=+crt-static

jobs:
  game-client-check:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Check out the original Horizon source
        uses: actions/checkout@v4
        with:
          repository: horizon-rust/horizon
          ref: 2e540fe373ce1e453572ada2343a56e1a9544e04
          path: horizon

      - name: Set up Python for package integrity verification
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install nightly Rust and source
        shell: pwsh
        run: |
          rustup toolchain install nightly --profile minimal --component rust-src
          $targets = rustc +nightly --print target-list
          if ($targets -notcontains "x86_64-win7-windows-msvc") {
            throw "Nightly does not include x86_64-win7-windows-msvc"
          }

      - name: Check the original native game client for Windows 7
        working-directory: horizon
        shell: pwsh
        run: |
          cargo +nightly check --locked -p horizon-client --bin horizon-client --target x86_64-win7-windows-msvc -Z build-std=std,panic_abort

      - name: Build the original Horizon game and companion tools for Windows 7
        working-directory: horizon
        shell: pwsh
        run: |
          cargo +nightly build --locked --release -p horizon-client -p horizon-client-lib --bins -p horizon-prepare -p horizon-server --target x86_64-win7-windows-msvc -Z build-std=std,panic_abort
          $binDir = "target/x86_64-win7-windows-msvc/release"
          foreach ($name in @("horizon-client.exe", "horizon-ctl.exe", "horizon-prepare.exe", "horizon-server.exe")) {
            if (-not (Test-Path (Join-Path $binDir $name))) { throw "The Windows 7 package is missing $name" }
          }

      - name: Fetch and verify the official exporter bundle for the pinned sources
        working-directory: horizon
        shell: pwsh
        run: |
          $tag = "nightly-2026-11-03"
          $sourceCommit = "294448014fba585f8d5d09dd8886f482493b6417"
          $release = Invoke-RestMethod "https://api.github.com/repos/horizon-rust/horizon/releases/tags/$tag"
          $asset = $release.assets | Where-Object { $_.name -eq "horizon-windows-x64.zip" } | Select-Object -First 1
          if (-not $asset) { throw "The official $tag Windows package is unavailable" }
          $archive = Join-Path $env:RUNNER_TEMP "horizon-official-$tag.zip"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $archive
          $sumsUrl = "https://github.com/horizon-rust/horizon/releases/download/$tag/SHA256SUMS"
          $sums = (Invoke-WebRequest -Uri $sumsUrl).Content
          $sumLine = $sums -split "\r?\n" | Where-Object { $_ -match "\s+\*?horizon-windows-x64\.zip$" } | Select-Object -First 1
          if (-not $sumLine) { throw "The official SHA256SUMS does not list horizon-windows-x64.zip" }
          $expected = ($sumLine -split "\s+")[0].ToLowerInvariant()
          $actual = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Official game archive SHA-256 mismatch" }

          $extract = Join-Path $env:RUNNER_TEMP "horizon-official-$tag"
          Expand-Archive -LiteralPath $archive -DestinationPath $extract -Force
          $officialExporters = Join-Path $extract "horizon-windows-x64\exporters"
          if (-not (Test-Path (Join-Path $officialExporters "manifest.json"))) { throw "The verified official archive has no exporter manifest" }
          if (Test-Path "exporters") { Remove-Item "exporters" -Recurse -Force }
          Copy-Item $officialExporters "exporters" -Recurse -Force

          # This bundle comes from commit 2944480. Bring forward only the Java inputs
          # included in its exporter key; the pinned Rust game code remains unchanged.
          $files = @(
            "VanillaAutoJumpOracle.java",
            "VanillaChunkGenerationOracle.java",
            "VanillaContainerScreenOracle.java",
            "VanillaFireStarterSoundOracle.java",
            "VanillaMarkerParticlesOracle.java",
            "VanillaParticleProvidersOracle.java",
            "VanillaProtocolClient.java",
            "GoatVoiceTranscript.java",
            "RideTranscript.java"
          )
          $sourceRoot = "mods/horizon/src/test/java/dev/horizonlab/parity"
          foreach ($file in $files) {
            $relative = "$sourceRoot/$file"
            $url = "https://raw.githubusercontent.com/horizon-rust/horizon/$sourceCommit/$relative"
            Invoke-WebRequest -Uri $url -OutFile (Join-Path $sourceRoot $file)
          }
          Write-Host "Downloaded the official exporter bundle and its exact, source-keyed Java inputs."

      - name: Package the complete Windows 7 game distribution
        working-directory: horizon
        shell: pwsh
        run: |
          cargo +nightly run --locked -p xtask -- package "target/x86_64-win7-windows-msvc/release/horizon-client.exe" "dist/horizon-windows-x64-win7"
          $package = "dist/horizon-windows-x64-win7"
          $sourceRoot = "mods/horizon/src/test/java/dev/horizonlab/parity"
          $packageSource = Join-Path $package $sourceRoot
          New-Item -ItemType Directory -Force -Path $packageSource | Out-Null
          $files = @(
            "VanillaAutoJumpOracle.java",
            "VanillaChunkGenerationOracle.java",
            "VanillaContainerScreenOracle.java",
            "VanillaFireStarterSoundOracle.java",
            "VanillaMarkerParticlesOracle.java",
            "VanillaParticleProvidersOracle.java",
            "VanillaProtocolClient.java",
            "GoatVoiceTranscript.java",
            "RideTranscript.java"
          )
          foreach ($file in $files) { Copy-Item (Join-Path $sourceRoot $file) (Join-Path $packageSource $file) -Force }

          $required = @(
            "horizon-client.exe",
            "horizon-ctl.exe",
            "horizon-prepare.exe",
            "horizon-server.exe",
            "PLAY.txt",
            "research-lock.json",
            "exporters/manifest.json",
            "crates/horizon-prepare/src/exporters.rs"
          )
          foreach ($relative in $required) {
            if (-not (Test-Path (Join-Path $package $relative))) { throw "Incomplete game package: missing $relative" }
          }

          @'
          import hashlib, json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          settings = b"exporters-v1 --release -proc:none -encoding UTF-8"
          h = hashlib.sha256()
          h.update(settings)
          compiler = (root / "crates/horizon-prepare/src/exporters.rs").read_bytes().replace(b"\r", b"")
          h.update(compiler)
          java_files = sorted(p for p in (root / "mods/horizon/src/test/java").rglob("*") if p.is_file() and p.suffix == ".java")
          paths = java_files + [root / "research-lock.json"]
          for p in paths:
              data = p.read_bytes().replace(b"\r", b"")
              rel = p.relative_to(root).as_posix()
              h.update(f"{rel}\0{len(data)}\0".encode())
              h.update(data)
          manifest = json.loads((root / "exporters/manifest.json").read_text(encoding="utf-8"))
          expected = h.hexdigest()
          if manifest.get("key") != expected:
              raise SystemExit(f"Exporter key mismatch: package expects {manifest.get('key')}, source calculates {expected}")
          classes = manifest.get("classes", {})
          if not classes:
              raise SystemExit("Exporter manifest lists no compiled classes")
          for relative, digest in classes.items():
              path = root / "exporters" / relative
              if not path.is_file() or hashlib.sha256(path.read_bytes()).hexdigest() != digest:
                  raise SystemExit(f"Exporter class missing or damaged: {relative}")
          print(f"Exporter bundle verified: {len(classes)} compiled classes; key {expected}")
          '@ | python - $package
          if ($LASTEXITCODE -ne 0) { throw "The exporter bundle does not match the packaged sources" }

          foreach ($name in @("horizon-client.exe", "horizon-ctl.exe", "horizon-prepare.exe", "horizon-server.exe")) {
            $binary = (Resolve-Path (Join-Path $package $name)).Path
            $test = Start-Process -FilePath $binary -ArgumentList @("--help") -Wait -PassThru
            if ($test.ExitCode -ne 0) { throw "$name failed its startup/help test with exit code $($test.ExitCode)" }
          }
          $archive = Join-Path (Get-Location) "Horizon-Windows7-Game.zip"
          if (Test-Path $archive) { Remove-Item $archive -Force }
          Push-Location "dist"
          try {
            & 7z a -tzip -mx=5 $archive ".\horizon-windows-x64-win7"
            if ($LASTEXITCODE -ne 0 -or -not (Test-Path $archive)) { throw "Could not create the complete Windows 7 game archive" }
          } finally {
            Pop-Location
          }
          Get-Item $archive | Select-Object Name,Length

      - name: Audit every packaged executable against Windows 7 imports
        working-directory: horizon
        shell: pwsh
        run: |
          $programFilesX86 = [Environment]::GetEnvironmentVariable("ProgramFiles(x86)")
          $vswhere = Join-Path $programFilesX86 "Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "vswhere.exe was not found" }
          $vs = & $vswhere -latest -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC" -Filter dumpbin.exe -Recurse |
            Where-Object { $_.FullName.EndsWith('\Hostx64\x64\dumpbin.exe', [StringComparison]::OrdinalIgnoreCase) } |
            Select-Object -First 1
          if (-not $dumpbin) { throw "dumpbin.exe was not found" }
          $forbidden = @("dcomp.dll", "d3d12.dll", "dxcore.dll", "CreateDXGIFactory2", "GetDpiForWindow", "GetDpiForMonitor", "GetSystemMetricsForDpi", "GetPointerType", "GetDpiForSystem", "GetThreadDpiAwarenessContext", "SetThreadDpiAwarenessContext", "GetWindowDpiAwarenessContext", "SetProcessDpiAwarenessContext", "GetCurrentPackageFullName", "GetCurrentPackageFamilyName", "SetThreadDescription", "GetThreadDescription", "GetSystemTimePreciseAsFileTime", "CreateFile2", "RoGetActivationFactory", "RoOriginateErrorW", "RoInitialize", "WindowsCreateString", "WaitOnAddress", "WakeByAddressAll", "WakeByAddressSingle", "ProcessPrng", "bcryptprimitives.dll", "api-ms-win-core-path-l1-1-0.dll", "api-ms-win-core-winrt-l1-1-0.dll", "api-ms-win-appmodel-runtime-l1-1-0.dll", "api-ms-win-core-synch-l1-2-0.dll", "api-ms-win-shcore-scaling-l1-1-1.dll")
          $package = "dist/horizon-windows-x64-win7"
          foreach ($binary in Get-ChildItem $package -Filter "*.exe") {
            $imports = (& $dumpbin.FullName /nologo /imports $binary.FullName | Out-String)
            $found = @($forbidden | Where-Object { $imports -match [regex]::Escape($_) })
            if ($found.Count -gt 0) { throw "$($binary.Name) imports APIs unavailable on Windows 7: $($found -join ', ')" }
            Write-Host "Win7 static-import audit passed: $($binary.Name)"
          }

      - name: Smoke-test the native game client process
        shell: pwsh
        working-directory: horizon
        run: |
          $binary = (Resolve-Path "target/x86_64-win7-windows-msvc/release/horizon-client.exe").Path
          # The native game client has no --version option; --help is its supported
          # no-graphics startup path and exits before renderer initialization.
          $help = Start-Process -FilePath $binary -ArgumentList @("--help") -Wait -PassThru
          if ($help.ExitCode -ne 0) { throw "The Windows 7 game client failed its --help startup test with exit code $($help.ExitCode)" }
          Write-Host "The game client starts and handles --help without initializing graphics."

      - name: Audit game client imports against Windows 7
        shell: pwsh
        working-directory: horizon
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "vswhere.exe was not found" }
          $vs = & $vswhere -latest -property installationPath
          if (-not $vs) { throw "Visual Studio installation was not found" }
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC" -Filter dumpbin.exe -Recurse |
            Where-Object { $_.FullName.EndsWith('\Hostx64\x64\dumpbin.exe', [StringComparison]::OrdinalIgnoreCase) } |
            Select-Object -First 1
          if (-not $dumpbin) { throw "dumpbin.exe was not found" }
          $binary = "target/x86_64-win7-windows-msvc/release/horizon-client.exe"
          $imports = (& $dumpbin.FullName /nologo /imports $binary | Out-String)
          $forbidden = @(
            "dcomp.dll",
            "d3d12.dll",
            "dxcore.dll",
            "CreateDXGIFactory2",
            "GetDpiForWindow",
            "GetDpiForMonitor",
            "GetSystemMetricsForDpi",
            "GetPointerType",
            "GetDpiForSystem",
            "GetThreadDpiAwarenessContext",
            "SetThreadDpiAwarenessContext",
            "GetWindowDpiAwarenessContext",
            "SetProcessDpiAwarenessContext",
            "GetCurrentPackageFullName",
            "GetCurrentPackageFamilyName",
            "SetThreadDescription",
            "GetThreadDescription",
            "GetSystemTimePreciseAsFileTime",
            "CreateFile2",
            "RoGetActivationFactory",
            "RoOriginateErrorW",
            "RoInitialize",
            "WindowsCreateString",
            "WaitOnAddress",
            "WakeByAddressAll",
            "WakeByAddressSingle",
            "ProcessPrng",
            "bcryptprimitives.dll",
            "api-ms-win-core-path-l1-1-0.dll",
            "api-ms-win-core-winrt-l1-1-0.dll",
            "api-ms-win-appmodel-runtime-l1-1-0.dll",
            "api-ms-win-core-synch-l1-2-0.dll",
            "api-ms-win-shcore-scaling-l1-1-1.dll"
          )
          $found = @($forbidden | Where-Object { $imports -match [regex]::Escape($_) })
          if ($found.Count -gt 0) { throw "Windows 7-incompatible game imports found: $($found -join ', ')" }
          Write-Host "Static import audit passed for the Windows 7 game client."
          Get-Item $binary | Select-Object Name,Length

      - name: Upload the complete Windows 7 game package
        uses: actions/upload-artifact@v4
        with:
          name: Horizon-Windows7-Game-Package
          path: horizon/Horizon-Windows7-Game.zip
          if-no-files-found: error
          retention-days: 30

      - name: Record target and toolchain
        if: always()
        working-directory: horizon
        run: |
          rustc +nightly -Vv
          cargo +nightly -V
          rustup target list --installed
