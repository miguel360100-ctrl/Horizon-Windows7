name: Windows compatibility baseline

concurrency:
  group: windows-compatibility-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    paths:
      - "gpui-fast-0.1.13/**"
      - ".github/workflows/windows-compatibility.yml"

permissions:
  contents: read

jobs:
  gpui-windows-build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: gpui-fast-0.1.13
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        run: rustup show

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: gpui-fast-0.1.13 -> target

      - name: Check Win32 API string terminators
        shell: pwsh
        run: |
          $files = Get-ChildItem "crates/gpui_windows/src" -Filter *.rs -Recurse
          $bad = $files | Select-String -Pattern 'PCSTR::from_raw\(b".*\\\\0'
          if ($bad) { throw "A Win32 API string has a literal backslash-zero instead of a NUL terminator: $($bad -join '; ')" }
          Write-Host "Win32 API strings use proper NUL terminators."

      - name: Compile GPUI Windows backend (Windows 7 compatibility)
        run: cargo check -p gpui_windows --all-targets --features windows7-compat

      - name: Compile GPUI Windows tests (Windows 7 compatibility)
        run: cargo check -p gpui_windows --tests --features windows7-compat

      - name: Compile GPUI Windows backend (modern Windows behavior)
        run: cargo check -p gpui_windows --all-targets

      - name: Compile GPUI platform feature forwarding
        run: cargo check -p gpui_platform --features windows7-compat

      - name: Experiment with the Rust Windows 7 target
        continue-on-error: true
        shell: pwsh
        run: |
          rustup toolchain install nightly --profile minimal --component rust-src
          $targets = rustc +nightly --print target-list
          if ($targets -notcontains "x86_64-win7-windows-msvc") {
            throw "The installed nightly compiler does not include x86_64-win7-windows-msvc"
          }
          cargo +nightly check -p gpui_windows --features windows7-compat --target x86_64-win7-windows-msvc -Z build-std


      - name: Record target and toolchain
        if: always()
        run: |
          rustc -Vv
          cargo -V
          rustup target list --installed
